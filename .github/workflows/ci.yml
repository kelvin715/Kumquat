name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Unit tests
        run: swift test
      - name: Wheel self-test
        run: .build/debug/Kumquat self-test
      - name: App bundle
        run: scripts/build-app.sh
